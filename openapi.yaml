          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
            description: Zero-based row offset for pagination (default 0)
          required: false
          description: Zero-based row offset for pagination (default 0)
          name: offset
          in: query
        - schema:
            type: boolean
            nullable: true
            default: false
            description: When true, triggers REFRESH MATERIALIZED VIEW CONCURRENTLY before querying
          required: false
          description: When true, triggers REFRESH MATERIALIZED VIEW CONCURRENTLY before querying
          name: refresh
          in: query
      responses:
        '200':
          description: Paginated global leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlobalLeaderboardEntry'
                  meta:
                    type: object
                    properties:
